name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src
      - name: Import smoke test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -c "import pygame; import slopfest; import slopfest.game; print('Slopfest', pygame.version.ver, slopfest.__version__)"
      - name: Asset manifest check
        run: python -c "from slopfest.assets import ASSETS; print('asset module import OK', type(ASSETS).__name__)"
